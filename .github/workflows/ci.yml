name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # A syntax error in a module the tests do not import would otherwise reach
      # the deployment untouched.
      - name: Byte-compile every module
        run: python -m compileall -q src scripts main.py

      - name: Run the tests
        run: python -m pytest -q
